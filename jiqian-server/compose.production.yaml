# 生产部署：MySQL 仅加入 Compose 内网；API 只绑定本机回环地址，供 Nginx HTTPS 反向代理。
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 512m
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=40"]
    environment:
      MYSQL_DATABASE: jiqian
      MYSQL_USER: jiqian
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env.production 中设置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.production 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - jiqian-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    image: jiqian-api:0.1.0
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/jiqian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: jiqian
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env.production 中设置 DB_PASSWORD}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?请在 .env.production 中设置 WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?请在 .env.production 中设置 WECHAT_APP_SECRET}
      WECHAT_PROXY_HOST: ${WECHAT_PROXY_HOST:-}
      WECHAT_PROXY_PORT: ${WECHAT_PROXY_PORT:-7890}
      JWT_SECRET: ${JWT_SECRET:?请在 .env.production 中设置 JWT_SECRET}
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx320m -XX:+UseSerialGC
    ports:
      - "127.0.0.1:18080:8080"

volumes:
  jiqian-mysql:
    name: jiqian-prod-mysql-data
